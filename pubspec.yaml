name: libre_tab
description: "Offline campfire songbook (ChordPro) and guitar tuner."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.3.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  meta: ^1.18.0
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.15.1
  cross_file: ^0.3.5+5
  drift_dev: ^2.35.0
  file_picker_platform_interface: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  share_plus_platform_interface: ^7.2.0
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # SIL Open Font License texts, shown on the in-app licenses page.
  assets:
    # Public-domain starter songs (lib/features/library/data/starter_songs.dart).
    - assets/songs/
    # The flame mark, for empty states (branding/png/mark.png at 256 px).
    - assets/images/mark.png
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # Variable fonts: weight and optical size are set with FontVariation.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# App icon, generated from branding/ (see branding/README.md).
flutter_launcher_icons:
  image_path: branding/app_icon/app-icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#100D0A"
  adaptive_icon_foreground: branding/app_icon/android-foreground.png
  adaptive_icon_foreground_inset: 0
