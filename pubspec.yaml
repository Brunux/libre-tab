name: libre_tab
description: "Offline campfire songbook (ChordPro) and guitar tuner."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  # SIL Open Font License texts, shown on the in-app licenses page.
  assets:
    - assets/fonts/AtkinsonHyperlegible-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    # Variable fonts: weight and optical size are set with FontVariation.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
